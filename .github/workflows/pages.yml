# Gizlilik politikası sayfasını GitHub Pages'te yayınlar (Play Console'daki gizlilik ve
# veri silme adresleri: https://suphiati.github.io/benim_kasam/gizlilik.html).
# Yalnızca public/gizlilik.html yayınlanır; uygulamanın kendisi burada çalışmaz.
name: Privacy page

on:
  push:
    branches: [main]
    paths: ['public/gizlilik.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp public/gizlilik.html site/gizlilik.html && cp public/gizlilik.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
